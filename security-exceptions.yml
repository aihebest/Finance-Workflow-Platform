# Accepted security findings.
#
# Every entry needs an owner, a justification, a linked issue and an expiry.
# scripts/check-exceptions.mjs fails the build when one expires, so an
# exception is a deferral with a deadline rather than a permanent suppression.
#
# Reviewed monthly by @desicon/security.

exceptions:
  - id: EX-2026-001
    tool: checkov
    rule: CKV_AZURE_211
    scope: infra/terraform/environments/dev
    severity: medium
    justification: >
      Dev App Service Plan runs a non-production SKU without zone redundancy.
      Dev holds no production data and is rebuilt from Terraform on demand.
      The same rule is enforced in prd by policy/terraform/azure_security.rego.
    owner: "@desicon/ict-platform"
    issue: https://github.com/desicon/finance-workflow/issues/12
    accepted_on: 2026-07-31
    expires_on: 2027-01-27

  # RETIRED 2026-08-22 -- EX-2026-002, npm-audit, GHSA-qwww-vcr4-c8h2
  # (React Router RSC Mode CSRF bypass). Accepted 2026-08-05, due to expire
  # 2026-09-04.
  #
  # Retired because the finding no longer exists, not because it was waived
  # again. Worth stating plainly, because the reason is not the one we
  # expected:
  #
  # When the exception was written the advisory read as a single range,
  # 7.12.0-8.2.0, which included the 7.18.2 this project holds. It has since
  # been split into two, and the 7.x half is ">=7.12.0 <7.18.2" -- so 7.18.2
  # is the patched version for that line. The upgrade on this branch was not
  # what closed it. It had already closed itself, quietly, and the exception
  # sat here suppressing a finding that was no longer being reported.
  #
  # The lesson is the familiar one on this project: an accepted risk needs
  # re-reading against the source, not just re-dating. An expiry date makes
  # you look again; it does not make you look at the right thing.
  #
  # Both halves are now clear regardless -- this branch moves to
  # react-router 8.3.0, above the ">=8.0.0 <8.3.0" range -- and npm audit
  # against the regenerated lockfile reports zero vulnerabilities at any
  # severity.
  #
  # NOTE, and this is the part that still needs a decision: nothing in CI
  # runs `npm audit`. ci.yml runs check-exceptions.mjs, which enforces that
  # entries in this file have not expired, but no step produces npm-audit
  # findings for them to be exceptions to. The input to this process is
  # never generated. See docs/15 §6.

  # Template — copy, do not edit the entry above.
  #
  # - id: EX-YYYY-NNN
  #   tool: trivy | checkov | tfsec | codeql | dependency-check | npm-audit
  #   rule: <rule or CVE id>
  #   scope: <path or image>
  #   severity: critical | high | medium | low
  #   justification: >
  #     Why the risk is acceptable, and what compensating control exists.
  #     "Not exploitable in our configuration" needs the reason, not the claim.
  #   owner: "@team-or-person"
  #   issue: <link>
  #   accepted_on: YYYY-MM-DD
  #   expires_on: YYYY-MM-DD   # Critical/High: max 30 days. Others: max 180.
