###############################################################################
# Deploy the API to dev.
#
# ci.yml builds, tests and validates. Nothing published the result anywhere --
# the App Service had been pointed at an image that was never pushed, and the
# database schema had never been applied outside Testcontainers. This workflow
# is the missing half of step 5.
#
# Three jobs, strictly ordered, because the ordering is the whole point:
#
#   build   -- produce an immutable, SHA-tagged image in ACR
#   migrate -- apply schema under a DDL principal that is NOT the app identity
#   deploy  -- repoint App Service at the new tag and prove it answers
#
# Migrations run before deploy so a schema failure never leaves new code
# running against an old schema. They run as a separate principal so the
# application itself remains unable to alter the tables it writes audit
# records into.
#
# No stored cloud credentials: every Azure call authenticates by OIDC
# federated identity. See docs/04-Security-and-DevSecOps.md.
#
# ACTION PINNING: the actions below are tag-pinned, matching ci.yml.
# scripts/check-action-pinning.mjs exists and requires 40-character SHAs, but
# nothing currently runs it -- ci.yml would fail its own check today. Pinning
# both workflows and wiring that script into CI is tracked separately; adding
# an unpinned workflow while the checker sits unused would quietly widen a gap
# that is already open.
###############################################################################

name: Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC to Azure -- no stored credentials

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never interrupt a migration mid-apply

env:
  AZURE_RESOURCE_GROUP: rg-desicon-fw-dev
  ACR_NAME: crdesiconfwdev
  IMAGE_REPOSITORY: finance-workflow-api
  APP_SERVICE_NAME: app-desicon-fw-api-dev
  WEB_APP_NAME: app-desicon-fw-web-dev
  WEB_IMAGE_REPOSITORY: finance-workflow-web
  FUNCTION_APP_NAME: func-desicon-fw-dev
  # Runtime storage for the Function App, which also holds the deployment
  # package container. Terraform output functions.storage_account_name.
  FUNCTION_STORAGE_ACCOUNT: stdesiconfwdevfn2
  FUNCTION_PACKAGE_CONTAINER: deployments
  SQL_SERVER_NAME: sql-desicon-fw-dev
  SQL_DATABASE_NAME: DesiconFinanceWorkflow
  FRONT_DOOR_HOSTNAME: fde-desicon-fw-dev-e5deetfbdxfvfsfq.z01.azurefd.net

jobs:
  # ────────────────────────────── Build image ──────────────────────────────
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The commit SHA, never :latest. A mutable tag makes "which build is
      # running in dev" unanswerable, and makes rollback a rebuild instead of
      # a repoint.
      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # az acr build runs the build inside ACR: no docker daemon on the
      # runner, no registry password, and the source never leaves Azure once
      # uploaded. The runner's OIDC token is the only credential involved.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "${IMAGE_REPOSITORY}:${{ steps.meta.outputs.tag }}" \
            --image "${IMAGE_REPOSITORY}:latest" \
            --file docker/api.Dockerfile \
            .

  # ─────────────────────────────── Migrations ──────────────────────────────
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Driven by global.json, not "8.0.x". Floating the SDK floats the
      # analyser set, and with TreatWarningsAsErrors that turns an SDK
      # release into a build break nobody can reproduce locally.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Restore, not install --global. .config/dotnet-tools.json pins
      # dotnet-ef to 8.0.10 with rollForward false, matching
      # Microsoft.EntityFrameworkCore.Design in the Infrastructure project.
      # A global install would ignore that pin, and a tool newer than the
      # runtime it targets generates subtly different SQL -- which is the
      # one thing a migration script must never do between environments.
      - name: Restore local dotnet tools
        run: dotnet tool restore

      # Built explicitly, then generated with --no-build.
      #
      # `dotnet ef` builds the project itself and, on failure, prints only
      # "Build failed. Use dotnet build to see the errors." -- discarding the
      # compiler output that says what actually broke. Directory.Build.props
      # sets TreatWarningsAsErrors, so any analyser warning fails the build,
      # and the useful message is exactly the one dotnet ef throws away.
      # Building here means CI reports the real error.
      - name: Build Infrastructure project
        run: dotnet build src/Desicon.Workflow.Infrastructure/Desicon.Workflow.Infrastructure.csproj

      # Generated, not applied directly by `dotnet ef database update`: the
      # script is reviewable, replayable, and idempotent, and the tool never
      # needs a live connection with DDL rights of its own.
      #
      # No --startup-project: WorkflowDbContextFactory in the Infrastructure
      # project is an IDesignTimeDbContextFactory, so the tool builds the
      # context without needing the API project to reference EFCore.Design.
      # Script generation is offline -- no database is contacted here.
      - name: Generate idempotent migration script
        run: |
          dotnet ef migrations script \
            --idempotent \
            --no-build \
            --project src/Desicon.Workflow.Infrastructure \
            --output migrate.sql
          echo "--- generated $(wc -l < migrate.sql) lines ---"

      # GitHub-hosted runners have no stable egress IP, so the firewall
      # exception is opened for this run and removed in the always() step
      # below. A permanent broad rule would be the alternative, and is worse.
      - name: Open SQL firewall for this runner
        id: firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "rule=gh-runner-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "gh-runner-${GITHUB_RUN_ID}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

      # Applied as the CI principal, which holds db_ddladmin -- not as the
      # app's managed identity, which deliberately cannot alter schema. See
      # scripts/create-migration-user.sql, which must have been run once
      # against this database before this job can succeed.
      - name: Apply migrations
        shell: pwsh
        run: |
          Install-Module SqlServer -Scope CurrentUser -Force -AllowClobber
          $token = (az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          Invoke-Sqlcmd `
            -ServerInstance "${{ env.SQL_SERVER_NAME }}.database.windows.net" `
            -Database "${{ env.SQL_DATABASE_NAME }}" `
            -AccessToken $token `
            -InputFile migrate.sql `
            -QueryTimeout 600 `
            -ErrorAction Stop
          Write-Host "Migrations applied."

      # Sequences are created here rather than by the application. The app
      # holds db_datawriter, which does not cover sequences: CREATE SEQUENCE
      # needs DDL, and even NEXT VALUE FOR on an existing sequence needs an
      # explicit UPDATE grant. See provision-request-sequences.sql.
      - name: Provision request-number sequences and grants
        shell: pwsh
        run: |
          $token = (az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          Invoke-Sqlcmd `
            -ServerInstance "${{ env.SQL_SERVER_NAME }}.database.windows.net" `
            -Database "${{ env.SQL_DATABASE_NAME }}" `
            -AccessToken $token `
            -InputFile scripts/provision-request-sequences.sql `
            -Variable @("ApiPrincipal=${{ env.APP_SERVICE_NAME }}","FunctionPrincipal=func-desicon-fw-dev","YearsAhead=2") `
            -ErrorAction Stop

      - name: Remove SQL firewall exception
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "${{ steps.firewall.outputs.rule }}" \
            --output none || true

  # ──────────────────────────────── Frontend ───────────────────────────────
  # Built and deployed independently of the API: the SPA holds no schema
  # dependency, so gating it behind the migration job would make a copy change
  # wait on a database migration for no reason.
  #
  # The bundle is built inside ACR from docker/web.Dockerfile, which runs
  # `npm ci && npm run build` and copies only dist/ into nginx. The build
  # toolchain — vite, esbuild, postcss — never reaches the published image.
  deploy-web:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Entra ids are baked in at build time because Vite inlines
      # import.meta.env at compile time -- there is no runtime configuration
      # in a static bundle. None of these are secrets: a public client id and
      # a tenant id are visible to anyone who opens the sign-in page. The
      # security boundary is the Entra app registration's redirect URI
      # allow-list and the API's token validation, not the secrecy of an id.
      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "${WEB_IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --image "${WEB_IMAGE_REPOSITORY}:latest" \
            --file docker/web.Dockerfile \
            --build-arg "VITE_ENTRA_CLIENT_ID=${{ secrets.VITE_ENTRA_CLIENT_ID }}" \
            --build-arg "VITE_ENTRA_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" \
            --build-arg "VITE_API_SCOPE=${{ secrets.VITE_API_SCOPE }}" \
            .

      - name: Point the Web App at the new image
        run: |
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --container-image-name "${LOGIN_SERVER}/${WEB_IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --container-registry-url "https://${LOGIN_SERVER}" \
            --output none

          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --output none

      # Checks the SPA actually serves, through Front Door, on the route that
      # matters. A 200 on /healthz proves nginx is up; fetching / and finding
      # the bundle reference proves the build produced something and that the
      # /* route reaches the SPA rather than the API.
      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/index.html -w "%{http_code}" "https://${FRONT_DOOR_HOSTNAME}/" || true)

            if [ "$code" = "200" ] && grep -q "/assets/index-" /tmp/index.html; then
              echo "SPA served after ${attempt} attempt(s)."
              exit 0
            fi

            echo "attempt ${attempt}: HTTP ${code}"
            sleep 10
          done

          echo "::error::The SPA did not serve through Front Door."
          echo "Last response:"
          head -c 500 /tmp/index.html || true
          exit 1

  # ───────────────────────────── Timer functions ───────────────────────────
  # Zip deploy, not a container. modules/functions provisions the Function App
  # as dotnet-isolated with WEBSITE_RUN_FROM_PACKAGE = 1, so the artefact is a
  # published zip rather than an image -- a different path from the API's, and
  # one that shares nothing with it beyond the OIDC login.
  #
  # Runs after migrate for the same reason the API deploy does: RetirementSweep
  # reads columns that a pending migration may not have created yet, and a
  # timer that fires against an old schema fails on a schedule rather than
  # visibly at deploy time.
  deploy-functions:
    name: Deploy timer functions
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish
        run: |
          dotnet publish src/Desicon.Workflow.Functions/Desicon.Workflow.Functions.csproj \
            --configuration Release \
            --output publish

      # Zipped from inside the publish directory so host.json sits at the root
      # of the archive. Zipping the directory itself nests everything one level
      # down, and the host then reports no functions found -- a silent success
      # that produces an app which starts and does nothing.
      - name: Package
        run: |
          cd publish
          zip -r ../functions.zip . -x '*.pdb'
          cd ..
          unzip -l functions.zip | head -20

      # Run-from-package via blob, not `az functionapp deployment source
      # config-zip`. That command talks to the Kudu SCM site with basic
      # authentication, which modules/functions disables
      # (webdeploy_publish_basic_authentication_enabled = false). It receives
      # a 401 with an empty body and fails trying to parse it as JSON, so the
      # symptom is an Azure CLI stack trace rather than an access denial.
      #
      # Uploading with --auth-mode login uses this job's OIDC identity; the
      # Function App then reads the package with its own managed identity.
      # No SAS, no storage key, no publishing profile.
      # The runtime storage account runs network_rules default_action = Deny
      # with only deployer IPs admitted, and GitHub-hosted runners have no
      # stable egress address. Same arrangement as the SQL firewall in the
      # migrate job: open a scoped exception for this run, remove it in the
      # always() step below. A standing broad rule would be the alternative,
      # and is worse.
      - name: Open storage firewall for this runner
        id: storage_firewall
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"

          az storage account network-rule add \
            --account-name "$FUNCTION_STORAGE_ACCOUNT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --ip-address "$RUNNER_IP" \
            --output none

          # Storage network ACLs are eventually consistent; an upload issued
          # immediately after can still be refused.
          sleep 30

      - name: Upload package
        id: package
        run: |
          BLOB="functions-${GITHUB_SHA}.zip"

          az storage blob upload \
            --account-name "$FUNCTION_STORAGE_ACCOUNT" \
            --container-name "$FUNCTION_PACKAGE_CONTAINER" \
            --name "$BLOB" \
            --file functions.zip \
            --auth-mode login \
            --overwrite \
            --output none

          echo "url=https://${FUNCTION_STORAGE_ACCOUNT}.blob.core.windows.net/${FUNCTION_PACKAGE_CONTAINER}/${BLOB}" >> "$GITHUB_OUTPUT"

      # Terraform ignores changes to this setting precisely so the deploy job
      # can own it -- see modules/functions. Setting it restarts the app and
      # the host mounts the new package read-only.
      - name: Point the Function App at the package
        run: |
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --settings "WEBSITE_RUN_FROM_PACKAGE=${{ steps.package.outputs.url }}" \
            --output none

          az functionapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --output none

          # Sync triggers explicitly. With run-from-package the host mounts a
          # zip it fetched itself, and ARM has no idea what triggers are
          # inside until it is told to look. Without this the app runs
          # correctly but `az functionapp function list` reports nothing, the
          # portal shows no functions, and — on a consumption or elastic plan
          # — the scale controller has no triggers to scale on, so timers may
          # not fire at all. Restart alone does not do it.
          #
          # Best-effort with retries, and deliberately not fatal. ARM forwards
          # this call to the host, so it fails while the host is still coming
          # up: BadGateway immediately after a restart, InternalServerError if
          # the host cannot reach its storage. Neither tells us whether the
          # deployment worked — the verify step below does, by asking what
          # functions actually registered. Failing here would stop us before
          # reaching the check that gives a usable answer.
          SITE_ID=$(az functionapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP_NAME" \
            --query id -o tsv)

          for attempt in $(seq 1 6); do
            sleep 20
            if az rest --method post \
                 --uri "${SITE_ID}/syncfunctiontriggers?api-version=2016-08-01" \
                 --output none 2>/tmp/sync_err; then
              echo "Trigger sync accepted on attempt ${attempt}."
              break
            fi
            echo "attempt ${attempt}: $(tr -d '\n' < /tmp/sync_err | cut -c1-200)"
          done

      # A deployment that reports success while the host loaded no functions
      # is the failure mode worth catching here: the timers simply never fire,
      # and nothing surfaces until someone notices overdue advances were never
      # flagged.
      - name: Remove storage firewall exception
        if: always() && steps.storage_firewall.outputs.ip != ''
        run: |
          az storage account network-rule remove \
            --account-name "$FUNCTION_STORAGE_ACCOUNT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --ip-address "${{ steps.storage_firewall.outputs.ip }}" \
            --output none || true

      # A deployment that reports success while the host loaded no functions
      # is the failure mode worth catching: the timers simply never fire, and
      # nothing surfaces until someone notices overdue advances were never
      # flagged.
      #
      # Each probe is wrapped in `timeout` because az functionapp function
      # list blocks rather than failing fast while the host is still starting
      # — an unbounded loop here ran for 41 minutes before the job gave up.
      - name: Verify the host loaded the expected functions
        timeout-minutes: 8
        run: |
          for attempt in $(seq 1 15); do
            names=$(timeout 45 az functionapp function list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNCTION_APP_NAME" \
              --query "[].name" -o tsv --only-show-errors 2>/dev/null || true)

            if echo "$names" | grep -q "RetirementSweep"; then
              echo "Functions registered:"
              echo "$names"
              exit 0
            fi

            echo "attempt ${attempt}: host reports [${names:-none}]"
            sleep 20
          done

          echo "::error::RetirementSweep was not registered after deployment."
          echo "Current WEBSITE_RUN_FROM_PACKAGE:"
          az functionapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNCTION_APP_NAME" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value" -o tsv --only-show-errors || true
          exit 1

  # ──────────────────────────────── Deploy ─────────────────────────────────
  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    needs: [build, migrate]
    steps:
      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Terraform ignores changes to docker_image_name precisely so this step
      # can own the tag without the next `terraform apply` reverting it.
      - name: Point App Service at the new image
        run: |
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --container-image-name "${LOGIN_SERVER}/${IMAGE_REPOSITORY}:${{ needs.build.outputs.image_tag }}" \
            --container-registry-url "https://${LOGIN_SERVER}" \
            --output none

      - name: Restart
        run: |
          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_SERVICE_NAME" \
            --output none

      # A deploy that reports success without the app answering is how four
      # separate misconfigurations survived unnoticed: a wrong connection
      # string key, a missing Column Encryption Setting, a Key Vault role that
      # covered secrets but not keys, and a network ACL that excluded the app
      # subnet. None of them prevented deployment. All of them would fail this.
      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/body -w "%{http_code}" "https://${FRONT_DOOR_HOSTNAME}/health/ready" || true)
            if [ "$code" = "200" ]; then
              echo "Ready after ${attempt} attempt(s)."
              cat /tmp/body
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 10
          done
          echo "::error::Application did not become ready. Last body:"
          cat /tmp/body || true
          az webapp log tail --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_SERVICE_NAME" --provider docker &
          sleep 20
          exit 1

      # Authenticated smoke test.
      #
      # /health/ready is necessarily excluded from Easy Auth so the platform
      # probe and the step above can reach it. That exclusion meant the
      # readiness check stayed green for an hour while every authenticated
      # call returned 401 -- three faults at once: a v1/v2 token mismatch, an
      # API validating against REPLACE_WITH_TENANT_ID, and `?? throw` guards
      # that accept a placeholder. A probe proving the app can reach its
      # database says nothing about whether a user can reach the app.
      #
      # WHAT THIS ASSERTS, AND WHY NOT 200
      # ----------------------------------
      # CI authenticates as a service principal, so it cannot obtain the token
      # a person gets, and no Employee row is linked to a service principal --
      # the endpoint will refuse it on those grounds. That refusal is a
      # success here: it proves the token was accepted by Easy Auth AND by the
      # API's own JWT validation, and that the request reached application
      # code. Only 401 means the auth chain is broken.
      #
      # So: unauthenticated must be 401 (Easy Auth is enforcing), and
      # authenticated must be anything but 401 (both validators accept it).
      - name: Authenticated smoke test
        run: |
          set +e

          anon=$(curl -s -o /dev/null -w "%{http_code}" "https://${FRONT_DOOR_HOSTNAME}/api/v1/my/inbox")
          echo "unauthenticated: HTTP ${anon}"

          if [ "$anon" != "401" ]; then
            echo "::error::Unauthenticated request returned ${anon}, expected 401. Easy Auth is not enforcing."
            exit 1
          fi

          token=$(az account get-access-token --resource "api://${{ secrets.VITE_ENTRA_CLIENT_ID }}" --query accessToken -o tsv 2>/tmp/token_err)

          if [ -z "$token" ]; then
            echo "::error::Could not obtain an access token for the API as the CI identity."
            echo "This usually means the service principal has no app role on the API registration."
            cat /tmp/token_err
            exit 1
          fi

          code=$(curl -s -o /tmp/auth_body -w "%{http_code}" \
            -H "Authorization: Bearer ${token}" \
            "https://${FRONT_DOOR_HOSTNAME}/api/v1/my/inbox")

          echo "authenticated: HTTP ${code}"
          head -c 300 /tmp/auth_body; echo

          if [ "$code" = "401" ]; then
            echo "::error::The API rejected a valid Entra token. Check AzureAd__TenantId/Audience on the app, the registration's requestedAccessTokenVersion, and auth_settings_v2.allowed_audiences -- these must agree on one token version."
            exit 1
          fi

          echo "Auth chain verified: token accepted by Easy Auth and by the API."
