name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # global.json, not "8.0.x" -- see the comment in that file. A floating
      # SDK floats AnalysisLevel="latest-recommended", and with
      # TreatWarningsAsErrors an SDK release becomes a build break with no
      # source change behind it.
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          # npm's cache keyed on the lockfile. Without this every run
          # re-downloads the full dependency tree, which for this project is
          # ~250 packages.
          cache: npm
          cache-dependency-path: src/Desicon.Workflow.Web/package-lock.json

      - name: Restore
        run: dotnet restore Desicon.FinanceWorkflow.sln

      # Building Desicon.Workflow.SchemaExport (part of the solution) also
      # regenerates tools/guard-field-schema.json as a side effect of its own
      # AfterTargets="Build" step -- see that project's csproj. This is both
      # the CI build step and the "regenerate" half of the schema-drift check
      # below; there is no separate manual export step to run first.
      - name: Build
        run: dotnet build Desicon.FinanceWorkflow.sln --no-restore

      - name: Test
        run: dotnet test Desicon.FinanceWorkflow.sln --no-build

      # Fails loudly (via loadGuardFieldSchema's CI-only hard-fail branch) if
      # the schema file the Build step above should have produced is somehow
      # missing, instead of silently skipping guard-field reachability checks
      # the way local dev is allowed to.
      - name: Validate workflow definitions
        run: node tools/validate-definitions.mjs

      # The schema file just regenerated by the Build step must match what is
      # committed. A non-empty diff means a guard field or FieldNames set
      # changed without the author re-running the build (or a hand-edit of
      # the generated file itself) -- either way, the committed schema is
      # stale and must fail the build rather than silently drift from the
      # domain model it is supposed to describe.
      - name: Check guard-field-schema.json is up to date
        run: |
          if ! git diff --exit-code -- tools/guard-field-schema.json; then
            echo "::error::tools/guard-field-schema.json is out of date. Run 'dotnet build Desicon.FinanceWorkflow.sln' and commit the regenerated file."
            exit 1
          fi

      # Every action must be pinned to a full commit SHA. A tag is a mutable
      # pointer, and these workflows hold an OIDC token for the Azure
      # subscription -- a moved tag would run unreviewed code with it.
      #
      # This script has existed since the scaffold and was never wired into
      # CI, so the workflows drifted to tag pins and the check that would
      # have caught it sat unused. That is the same shape as the guard-field
      # seam and the conftest canary: a control that exists but never runs.
      # Placed before the heavier steps so it fails fast.
      - name: Check GitHub Actions are pinned to commit SHAs
        run: node scripts/check-action-pinning.mjs

      - name: Setup conftest
        run: |
          curl -sSL -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/conftest
          rm conftest.tar.gz
          conftest --version

      # The frontend, built in the same job rather than a parallel one.
      #
      # A separate job would be faster, but it would also need adding to the
      # required status checks on main -- and until someone remembers to do
      # that, a pull request touching only web code merges without the
      # frontend ever being compiled. Keeping it inside the check that is
      # already required means it cannot be forgotten. Revisit when the job
      # duration justifies the extra wiring.
      #
      # `npm ci`, not `npm install`: it installs exactly what package-lock.json
      # pins and fails if the two disagree, which is the same reasoning as the
      # SHA-pinned actions and the pinned SDK.
      - name: Restore web dependencies
        working-directory: src/Desicon.Workflow.Web
        run: npm ci

      # Type-checks with the strict settings in tsconfig.json
      # (exactOptionalPropertyTypes, noUncheckedIndexedAccess) and then builds
      # for the browser targets that include mobile Safari, which is a
      # required browser for the approval path rather than a nice-to-have.
      - name: Build web
        working-directory: src/Desicon.Workflow.Web
        run: npm run build

      # security-exceptions.yml records accepted findings with an owner, a
      # justification and an expiry date. Nothing ran this script until now,
      # which made every expiry decorative: an exception with a deadline
      # nobody enforces is a permanent suppression that merely looks
      # temporary. SECURITY.md and docs/06 both describe it as a control, and
      # docs/06 counts open exceptions as a maturity metric.
      - name: Check accepted security exceptions have not expired
        run: node scripts/check-exceptions.mjs

      # A conftest run that silently matches zero policy rules exits 0 and
      # is indistinguishable from a genuinely clean plan -- this bit us once
      # already (the bare `conftest test --policy policy/terraform` command
      # evaluated 0 rules until conftest.toml pinned the namespace). Prove
      # the gate is alive on every run, against a fixture known to violate
      # policy, before trusting it to ever pass a real plan.
      - name: Verify the conftest policy gate catches known-bad input
        run: node scripts/check-conftest-canary.mjs
